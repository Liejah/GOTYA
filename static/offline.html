<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7555e8">
  <title>Gotya - You're offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f6f3fc;
      color: #302547;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 24px; margin: 20px 0 10px; }
    p { line-height: 1.6; color: #655b75; }
    button {
      margin-top: 14px;
      padding: 12px 24px;
      border: 0;
      border-radius: 24px;
      background: #7555e8;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <img src="/static/gotya-icon.svg" alt="Gotya">
    <h1>You're offline</h1>
    <p>Gotya can't connect right now. Check your internet connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
