<header class="gotya-topbar">
  <a class="gotya-brand" href="{{ url_for('feed') }}" aria-label="Gotya Home">
    <span class="gotya-brand-mark">G</span><span>{{ gotya_header_label|default('Gotya') }}</span>
  </a>
  {% if not gotya_hide_header_actions %}<div class="gotya-top-actions">
    <span class="gotya-top-icon" role="img" aria-label="Search" title="Search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    </span>
    <button class="gotya-top-icon" id="gotyaSharedNotificationButton"
            type="button" aria-label="Notifications" title="Notifications">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg>
    </button>
  </div>{% endif %}
</header>
<script>
(function () {
  const button = document.getElementById("gotyaSharedNotificationButton");
  if (!button) return;
  button.addEventListener("click", function () {
    const existing = document.getElementById("gotyaNotificationToggle")
                  || document.getElementById("gotyaNotificationButton");
    if (existing) existing.click();
    else window.location.href = {{ url_for('friends')|tojson }};
  });
})();
</script>
